# ==============================================================================
# TR Presentation ShareHub - Production coTURN Server Configuration
# Location: /etc/turnserver.conf
# ==============================================================================

# Network interfaces and ports
listening-port=3478
tls-listening-port=443
alt-listening-port=3479
alt-tls-listening-port=444

# Relay IP (Set to your server's public IPv4 address)
# external-ip=203.0.113.50

# Long-term credential mechanism for WebRTC clients
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_A_SECURE_64_CHAR_HEX_SECRET

# Realm matches your TURN domain
realm=turn.sharehub.example.com

# SSL / TLS Certificates (Let's Encrypt)
cert=/etc/letsencrypt/live/turn.sharehub.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.sharehub.example.com/privkey.pem

# TLS Cipher Suite (Modern & Secure)
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Relay UDP Port Range (Open these in your cloud security group / firewall)
min-port=49152
max-port=65535

# Do not allow loopback addresses for relay targets (anti-SSRF security)
no-loopback-peers
no-multicast-peers

# Fingerprint in TURN messages
fingerprint

# Bandwidth and Quota Limits
total-quota=200
bps-capacity=0
stale-nonce=600

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver/turnserver.log
